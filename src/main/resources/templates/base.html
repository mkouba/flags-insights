<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&display=swap"
        rel="stylesheet">
    {#insert bundles}
    {#bundle /}
    {/insert}
    <link rel="stylesheet" href="/css/{flag:string('theme','light')}.css">
    <title>Quarkus - Feature Flags Demo - {#insert title /}</title>
    <script>{#insert js-head /}</script>
</head>

<body>
    <div class="container-fluid main-container">
        <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 py-2">
            <img class="brand-logo" alt="Quarkus"
                 src="/images/quarkus-horizontal-{flag:string('theme','light')}.svg">
            {#if user:authenticated}
            <div class="d-flex align-items-center gap-2">
                <span class="text-muted">Signed in as <strong>{user:name}</strong>{#if user:timezone} <span class="badge text-bg-secondary">{user:timezone} · {user:localTime}</span>{/if}</span>
                <form method="post" action="/logout" class="m-0">
                    <button type="submit" class="btn btn-sm btn-outline-secondary">Logout</button>
                </form>
            </div>
            {/if}
        </div>
        <div class="text-muted text-uppercase small fw-semibold mb-5">Feature Flags Demo</div>
        <h1>{#insert title /}</h1>
        {#insert content /}
    </div>

    <footer>
        <small>
            <!-- footer TODO -->
        </small>
    </footer>

</body>

</html>
