<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&display=swap"
        rel="stylesheet">
    {#insert bundles}
    {#bundle /}
    {/insert}
    <link rel="stylesheet" href="/css/{flag:string('theme','light')}.css">
    <title>Quarkus - Feature Flags Demo - {#insert title /}</title>
</head>

<body>
    <div class="container-fluid main-container">
        <nav class="navbar navbar-expand-lg app-navbar" data-bs-theme="{flag:string('theme','light')}">
            <div class="container-fluid px-0">
                <span class="navbar-brand app-title mb-0 d-inline-flex align-items-center gap-2">
                    <i class="bi bi-toggle-on app-title-icon" aria-hidden="true"></i>
                    Feature Flags Demo
                </span>
                {#if user:authenticated}
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                        data-bs-target="#navUser" aria-controls="navUser"
                        aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse justify-content-end" id="navUser">
                    <div class="d-flex align-items-center flex-wrap gap-2 mt-2 mt-lg-0">
                        <span class="navbar-text">Signed in as <strong>{user:name}</strong>{#if user:timezone} <span class="badge text-bg-primary">{user:timezone} · {user:localTime}</span>{/if}</span>
                        <form method="post" action="/logout" class="m-0">
                            <button type="submit" class="btn btn-sm btn-outline-secondary">Logout</button>
                        </form>
                    </div>
                </div>
                {/if}
            </div>
        </nav>
        <h1 class="page-title">{#insert title /}</h1>
        {#insert content /}
    </div>

    <footer>
        <div class="footer-brand">
            <img class="brand-logo" alt="Quarkus"
                 src="/images/quarkus-horizontal-{flag:string('theme','light')}.svg">
            <small class="text-muted powered-by">
                Powered by <a href="https://docs.quarkiverse.io/quarkus-flags/dev/">quarkus-flags</a>
            </small>
        </div>
    </footer>

</body>

</html>
