# flags
quarkus.flags.cache.enabled=true
quarkus.flags.cache.ttl=2m
# Disable caching for tests
%test.quarkus.flags.cache.enabled=false

# theme flag - defined via the config source; the actual value is computed per request
# by the custom ThemeFlagEvaluator (identifier "insights.theme") from the user's time zone
quarkus.flags.build.theme.value=light
quarkus.flags.build.theme.meta.evaluator=insights.theme

# security
quarkus.http.auth.basic=true
quarkus.http.auth.session.encryption-key=quarkusflagsrules

# form-based authentication
quarkus.http.auth.form.enabled=true
quarkus.http.auth.form.login-page=/login
quarkus.http.auth.form.post-location=/login_security_check
quarkus.http.auth.form.username-parameter=username
quarkus.http.auth.form.password-parameter=password
quarkus.http.auth.form.error-page=/login/error
quarkus.http.auth.form.landing-page=/dashboard
quarkus.http.auth.form.cookie-name=insights-flags-credentials
# admin policy
quarkus.http.auth.policy.admin-policy.roles-allowed=admin
quarkus.http.auth.permission.admin.paths=/admin/users
quarkus.http.auth.permission.admin.policy=admin-policy
# user policy
quarkus.http.auth.policy.user-policy.roles-allowed=user
quarkus.http.auth.permission.user.paths=/dashboard
quarkus.http.auth.permission.user.policy=user-policy

quarkus.hibernate-orm.schema-management.strategy=drop-and-create

# web bundler
quarkus.web-bundler.dependencies.auto-import=all
quarkus.web-bundler.browser-live-reload=false
quarkus.web-bundler.bundle.dashboard=true

%dev.quarkus.datasource.dev-ui.allow-sql=true
